[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment"
version = "0.1.0"
description = "Reproducible IMDB comparison: linear baselines, RNN and LSTM"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "datasets>=2.18", "scikit-learn>=1.3", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "seaborn>=0.13", "tqdm>=4.66", "PyYAML>=6", "joblib>=1.3"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
