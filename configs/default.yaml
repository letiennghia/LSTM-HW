seed: 42
data:
  dataset_name: stanfordnlp/imdb
  validation_fraction: 0.2
  lowercase: true
  max_vocab_size: 20000
  max_seq_len: 300
  batch_size: 64
  num_workers: 0
baselines:
  max_features: 100000
  ngram_range: [1, 2]
  min_df: 2
  sublinear_tf: true
  c_grid: [0.1, 1.0, 10.0]
  logistic_max_iter: 1000
neural:
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 1
  bidirectional: false
  dropout: 0.3
  epochs: 8
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0
  grad_clip: 1.0
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0001
  selection_metric: val_loss
device: auto
output_dir: outputs
